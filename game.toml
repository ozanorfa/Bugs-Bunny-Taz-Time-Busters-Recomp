# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "BugsBunnyTaz"
id = "SLUS-01144"
players = 2
exe = "disc/SLUS_011.44"
# Relative to the project root: the disc folder next to this repo (kept out
# of git; same layout on every machine, docs/WINDOWS_AND_LAN.md).
disc = "../disc/BugsBunnyTaz_TimeBusters_USA.cue"
load_address = "0x80010200"
entry_pc = "0x80010208"
text_size = "0x0007E000"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "BugsBunnyTaz_TimeBusters_USA.bin"
cue_name = "BugsBunnyTaz_TimeBusters_USA.cue"
boot_exe = "SLUS_011.44"
known_sizes = [678069840]
known_md5 = [
  "03fd0dc4af76689e571eeac73721602c",
]
known_sha1 = [
  "9beb05a6f61b4a64ca4548f9f7a48c5f4d0bdb3a",
]
known_crc32 = [
  "22dd3004",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true

[runtime]
window_title = "BugsBunnyTaz Recompiled"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"

# Two / three views (mod package bbt.own-view, NOTES.md "Two views at full
# speed"): the game logic advances once per frame (fixed step), and with the
# engine's second view a frame takes ~3.6 vblanks of CPU instead of <= 2, so
# the whole game ran at ~55% speed. While the view count byte 0x8008DE00 is 2
# or 3 ((byte & 0xFE) == 2; only that mod sets it, stock is always 1) game code
# is charged a quarter of its cycles, so a multi-view frame fits the game's
# 2-vblank pacing again (2 views: every frame; 3 views: 0.475 frames per
# vblank, the rest is emulated GPU time, which the scale does not touch). The gate is judged at
# every vblank edge, so netplay peers and rollback agree (docs/config_schema.md
# "Timing block"); the scale is part of the netplay fingerprint.
[timing]
guest_cycle_scale = 4
guest_cycle_scale_gate = [
  { addr = 0x8008DE00, size = 1, mask = 0xFE, value = 2 },
]

[controller]
default_mode = "digital"
# The game is played with a digital pad (what every build before psxrecomp
# v0.3.7 presented: a plain digital controller that ignores the DualShock
# config command 0x43). Since v0.3.7 an unlocked local seat is a
# config-capable DualShock; the game's pad driver then loops the DualShock
# detection (43/45/46/47/4C/4D) and polls the buttons only about once every
# 27 frames, so short presses are lost (BUGS #49). Netplay and multitap
# seats are not affected. Drop this line once a probe without it shows one
# button poll per frame again (NOTES "Framework pins").
lock_mode = true
# Player 1 = the first connected gamepad, and the keyboard keys work too
# (the runtime merges each seat's keyboard binds into its device). On every
# PC in a match the local player is player 1. A player's own settings.toml
# (Settings -> Input) overrides it.
p1_device = "auto"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "f01836c0f851a556686541ed5969411abfeb6c7c44539b729ca1975ffd267e06"
# Keep the selected mods in a netplay match (default: cleared). A LAN room
# opened in the launcher sends the host's mod plan to the guests; a
# command-line match compares every peer's own plan (docs/NETPLAY.md, Mods).
content_negotiation = true
