# Decorations: a Turkish flag hanging from the windows of Granny's house in
# Granwich. Selects the trusted plugin compiled into this game from
# src/mods/decor.c, which paints the flag into the game's own wall texture
# while Granwich uploads it (every renderer, every peer of a match). This
# package contains no game data.
format_version = 11
id = "bbt.decor"
version = "0.6.0"
# 0.<N>.0: N is the netplay compatibility number every bbt.* package shares
# (and VERSION). Bump it in all of them on any change to simulation
# behaviour (docs/WINDOWS_AND_LAN.md, section 8).
name = "Decorations"
author = "BugsBunnyTazRecomp project"
description = "A Turkish flag hangs from the windows of Granny's house in Granwich."
resolver = "declarative"

[[target]]
game_id = "SLUS-01144"

[[feature]]
id = "turkish-flag"
name = "Turkish flag in Granwich"
description = "A Turkish flag hangs from the arched windows on both sides of Granny's house, the way flags are hung from windows on national holidays. Drawn into the game's own wall texture at its own resolution, so it shows with every renderer and in a netplay match (every player needs the same choice)."
group = "Decorations"
# Off by default since 2026-11-18 (the project is public; the user: "global
# bir projeyiz"). Players turn it on in Mods; in a LAN room the host's
# choice counts for every PC.
default_enabled = false

[[plugin]]
feature = "turkish-flag"
id = "bbt.decor"

# The texture-upload hook is shared (src/mods/load_image_hub.h).
[[requirement]]
feature = "turkish-flag"
package = "bbt.shared"
requires_feature = "load-image"
