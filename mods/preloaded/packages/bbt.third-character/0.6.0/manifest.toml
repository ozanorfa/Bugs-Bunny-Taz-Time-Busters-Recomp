# Third character: Daffy Duck as the third player.
# Selects the trusted plugin compiled into this game from
# src/mods/third_player.c, third_actor.c and third_hud.c. This package
# contains no game data.
format_version = 11
id = "bbt.third-character"
version = "0.6.0"
# 0.<N>.0: N is the netplay compatibility number every bbt.* package shares
# (and VERSION). Bump it in all of them on any change to simulation
# behaviour: a LAN guest without the host's version is refused, so two
# different builds cannot start a match (docs/WINDOWS_AND_LAN.md, section 8).
name = "Third Character"
author = "BugsBunnyTazRecomp project"
description = "Daffy Duck as a third player next to Bugs and Taz in 2-player mode."
resolver = "declarative"

[[target]]
game_id = "SLUS-01144"

[[feature]]
id = "p3"
name = "Third player: Daffy Duck"
description = "In 2-player mode, every level with Taz gets a third hero next to him, played from seat 3: a third controller, or the third PC in a LAN room. His model is read from your own disc (LEVEL1/RETRY.BZZ), and Bugs' animations are fitted to his skeleton when the game starts. He has his own health panel, and enemies go for him too. Needs the 3-player configuration (5 controller seats, multitap on port 2). He appears only when there is a third player: in a LAN room when three are seated; on one PC once Player 3 (a controller set in Settings -> Input) presses any button (he comes at once, next to Taz)."
group = "Third character"
default_enabled = true

[[plugin]]
feature = "p3"
id = "bbt.third-character.p3"

[[plugin]]
feature = "p3"
id = "bbt.third-character.p3-actor"

[[plugin]]
feature = "p3"
id = "bbt.third-character.p3-hud"

[[option]]
feature = "p3"
id = "sounds"
label = "Daffy's sounds"
type = "choice"
default = "bugs"

[[option.choice]]
value = "bugs"
label = "Bugs' steps, jumps and attack"

[[option.choice]]
value = "taz"
label = "Taz's (as Taz)"

[[option.choice]]
value = "quiet"
label = "None of Taz's sounds"

[[option]]
feature = "p3"
id = "comeback"
label = "When Daffy is out"
type = "choice"
default = "auto"

[[option.choice]]
value = "auto"
label = "He comes back next to Taz after 5 seconds"

[[option.choice]]
value = "team"
label = "As Bugs and Taz: when the team comes back, or a package (the game's rule)"

[[option]]
feature = "p3"
id = "appear"
label = "Appears"
type = "choice"
default = "auto"

[[option.choice]]
value = "auto"
label = "Only with a third player"

[[option.choice]]
value = "always"
label = "Always (tests: seat 3 driven by the debug command)"

# The third actor's Actor_Update hook goes through bbt.shared
# (src/mods/actor_update_hub.h).
[[requirement]]
feature = "p3"
package = "bbt.shared"
requires_feature = "actor-update"
