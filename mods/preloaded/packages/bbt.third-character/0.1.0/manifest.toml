# Third character mod (Phase 3, in development).
# Selects the trusted plugin compiled into this game from
# src/mods/third_character.c. This package contains no game data.
format_version = 11
id = "bbt.third-character"
version = "0.1.0"
name = "Third Character (in development)"
author = "BugsBunnyTazRecomp project"
description = "Work in progress: replaces Taz with another in-game character in 2-player mode."
resolver = "declarative"

[[target]]
game_id = "SLUS-01144"

[[feature]]
id = "swap-test"
name = "Swap test: Taz uses Bugs' model"
description = "Developer test (milestone M1). In 2-player mode, Taz is drawn with Bugs' model and animations after each level load. Taz's controls and behaviour are unchanged. Do not combine with the TRCA01 feature."
group = "Third character (in development)"
default_enabled = false

[[plugin]]
feature = "swap-test"
id = "bbt.third-character.swap-test"

[[feature]]
id = "trca01"
name = "Taz becomes the Transylvania enemy"
description = "In development. In 2-player mode, Taz is drawn with the model and animations of the hunched enemy from the Transylvania level, read from your own disc (LEVEL5/TRCA01.BZZ) when the game starts. Taz's controls and behaviour are unchanged. Standing, running and jumping use the enemy's own animations; other moves show its standing pose for now, and textures are only fully right inside that level. Do not combine with the swap test."
group = "Third character (in development)"
default_enabled = false

[[plugin]]
feature = "trca01"
id = "bbt.third-character.trca01"

[[option]]
feature = "trca01"
id = "size"
label = "Size"
type = "choice"
default = "75"

[[option.choice]]
value = "100"
label = "100% (the enemy's own size)"

[[option.choice]]
value = "85"
label = "85%"

[[option.choice]]
value = "75"
label = "75% (about Bugs' height)"

[[option.choice]]
value = "65"
label = "65%"
