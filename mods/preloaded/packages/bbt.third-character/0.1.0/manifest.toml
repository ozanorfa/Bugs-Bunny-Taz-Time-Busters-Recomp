# Third character mod (Phase 3, in development).
# Selects the trusted plugin compiled into this game from
# src/mods/third_character.c and src/mods/third_player.c. This package
# contains no game data.
format_version = 11
id = "bbt.third-character"
version = "0.1.0"
name = "Third Character (in development)"
author = "BugsBunnyTazRecomp project"
description = "Daffy Duck as a third player next to Bugs and Taz in 2-player mode, plus the older tests that turn Taz into another in-game character."
resolver = "declarative"

[[target]]
game_id = "SLUS-01144"

[[feature]]
id = "swap-test"
name = "Swap test: Taz uses Bugs' model"
description = "Developer test (milestone M1). In 2-player mode, Taz is drawn with Bugs' model and animations after each level load. Taz's controls and behaviour are unchanged. Do not combine with the TRCA01 feature."
group = "Third character (in development)"
default_enabled = false

[[plugin]]
feature = "swap-test"
id = "bbt.third-character.swap-test"

[[feature]]
id = "trca01"
name = "Taz becomes the Transylvania enemy"
description = "In development. In 2-player mode, Taz is drawn with the model, animations and textures of the hunched enemy from the Transylvania level, read from your own disc (LEVEL5/TRCA01.BZZ) when the game starts. Taz's controls and behaviour are unchanged. Standing, running, jumping, falling, landing and the spin (with its tornado) use matching enemy animations; a few other moves show a standing pose. Do not combine with the swap test."
group = "Third character (in development)"
default_enabled = false

[[plugin]]
feature = "trca01"
id = "bbt.third-character.trca01"

[[option]]
feature = "trca01"
id = "size"
label = "Size"
type = "choice"
default = "75"

[[option.choice]]
value = "100"
label = "100% (the enemy's own size)"

[[option.choice]]
value = "85"
label = "85%"

[[option.choice]]
value = "75"
label = "75% (about Bugs' height)"

[[option.choice]]
value = "65"
label = "65%"

[[feature]]
id = "p3"
name = "Third player: Daffy Duck"
description = "In 2-player mode, every level with Taz gets a third hero next to him, played from seat 3: a third controller, or the third PC in a LAN room. Character: Daffy Duck (the default; his model is read from your own disc, LEVEL1/RETRY.BZZ, and Bugs' animations are fitted to his skeleton when the game starts) or the hunched enemy from the Transylvania level (LEVEL5/TRCA01.BZZ). He has his own health panel, and enemies go for him too. His textures are at half vertical resolution. Needs the 3-player configuration (5 controller seats, multitap on port 2). He appears only when there is a third player: in a LAN room when three are seated, on one PC when Player 3 has a controller in Settings -> Input. Do not combine with \"Taz becomes the Transylvania enemy\" or the swap test."
group = "Third character (in development)"
default_enabled = true

[[plugin]]
feature = "p3"
id = "bbt.third-character.p3"

[[plugin]]
feature = "p3"
id = "bbt.third-character.p3-actor"

[[plugin]]
feature = "p3"
id = "bbt.third-character.p3-hud"

[[option]]
feature = "p3"
id = "size"
label = "Size (the enemy; Daffy keeps his own)"
type = "choice"
default = "75"

[[option.choice]]
value = "100"
label = "100% (the enemy's own size)"

[[option.choice]]
value = "85"
label = "85%"

[[option.choice]]
value = "75"
label = "75% (about Bugs' height)"

[[option.choice]]
value = "65"
label = "65%"

[[option]]
feature = "p3"
id = "character"
label = "Character"
type = "choice"
default = "daffy"

[[option.choice]]
value = "enemy"
label = "The Transylvania enemy"

[[option.choice]]
value = "daffy"
label = "Daffy Duck (moves fitted from Bugs' animations)"

[[option]]
feature = "p3"
id = "sounds"
label = "Daffy's sounds"
type = "choice"
default = "bugs"

[[option.choice]]
value = "bugs"
label = "Bugs' steps, jumps and attack"

[[option.choice]]
value = "taz"
label = "Taz's (as Taz)"

[[option.choice]]
value = "quiet"
label = "None of Taz's sounds"

[[option]]
feature = "p3"
id = "appear"
label = "Appears"
type = "choice"
default = "auto"

[[option.choice]]
value = "auto"
label = "Only with a third player"

[[option.choice]]
value = "always"
label = "Always (tests: seat 3 driven by the debug command)"

# The third actor's Actor_Update hook goes through bbt.shared
# (src/mods/actor_update_hub.h).
[[requirement]]
feature = "p3"
package = "bbt.shared"
requires_feature = "actor-update"
