# Third character mod (Phase 3, in development).
# Selects the trusted plugin compiled into this game from
# src/mods/third_character.c and src/mods/third_player.c. This package
# contains no game data.
format_version = 11
id = "bbt.third-character"
version = "0.1.0"
name = "Third Character (in development)"
author = "BugsBunnyTazRecomp project"
description = "Work in progress: replaces Taz with another in-game character in 2-player mode."
resolver = "declarative"

[[target]]
game_id = "SLUS-01144"

[[feature]]
id = "swap-test"
name = "Swap test: Taz uses Bugs' model"
description = "Developer test (milestone M1). In 2-player mode, Taz is drawn with Bugs' model and animations after each level load. Taz's controls and behaviour are unchanged. Do not combine with the TRCA01 feature."
group = "Third character (in development)"
default_enabled = false

[[plugin]]
feature = "swap-test"
id = "bbt.third-character.swap-test"

[[feature]]
id = "trca01"
name = "Taz becomes the Transylvania enemy"
description = "In development. In 2-player mode, Taz is drawn with the model, animations and textures of the hunched enemy from the Transylvania level, read from your own disc (LEVEL5/TRCA01.BZZ) when the game starts. Taz's controls and behaviour are unchanged. Standing, running, jumping, falling, landing and the spin (with its tornado) use matching enemy animations; a few other moves show a standing pose. Do not combine with the swap test."
group = "Third character (in development)"
default_enabled = false

[[plugin]]
feature = "trca01"
id = "bbt.third-character.trca01"

[[option]]
feature = "trca01"
id = "size"
label = "Size"
type = "choice"
default = "75"

[[option.choice]]
value = "100"
label = "100% (the enemy's own size)"

[[option.choice]]
value = "85"
label = "85%"

[[option.choice]]
value = "75"
label = "75% (about Bugs' height)"

[[option.choice]]
value = "65"
label = "65%"

[[feature]]
id = "p3"
name = "Third player: the Transylvania enemy (Phase 4, in development)"
description = "Developer test. In 2-player mode, every level with Taz gets a third character next to him: a copy of Taz drawn with the model, animations and textures of the hunched enemy from the Transylvania level, read from your own disc (LEVEL5/TRCA01.BZZ). Bugs and Taz stay themselves. A third controller (seat 3) drives it, read every frame through the same path netplay synchronizes; this needs a build with 5 controller seats and a 3-player game.toml (multitap on port 2). Its textures are at half vertical resolution. Character: Daffy Duck (the default; his model read from LEVEL1/RETRY.BZZ; he has no gameplay moves on the disc, so Bugs' animations are fitted to his skeleton when the game starts), or the enemy. It has its own health panel in the HUD. Do not combine with the TRCA01 feature or the swap test."
group = "Third character (in development)"
default_enabled = false

[[plugin]]
feature = "p3"
id = "bbt.third-character.p3"

[[plugin]]
feature = "p3"
id = "bbt.third-character.p3-actor"

[[plugin]]
feature = "p3"
id = "bbt.third-character.p3-hud"

[[option]]
feature = "p3"
id = "size"
label = "Size (the enemy; Daffy keeps his own)"
type = "choice"
default = "75"

[[option.choice]]
value = "100"
label = "100% (the enemy's own size)"

[[option.choice]]
value = "85"
label = "85%"

[[option.choice]]
value = "75"
label = "75% (about Bugs' height)"

[[option.choice]]
value = "65"
label = "65%"

[[option]]
feature = "p3"
id = "character"
label = "Character"
type = "choice"
default = "daffy"

[[option.choice]]
value = "enemy"
label = "The Transylvania enemy"

[[option.choice]]
value = "daffy"
label = "Daffy Duck (in development: his model from LEVEL1/RETRY.BZZ, moving with Bugs' animations)"

# The third actor's Actor_Update hook goes through bbt.shared
# (src/mods/actor_update_hub.h).
[[requirement]]
feature = "p3"
package = "bbt.shared"
requires_feature = "actor-update"
