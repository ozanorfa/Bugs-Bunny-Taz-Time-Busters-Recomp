# Shared game hooks (internal). One function override several of our
# features need: the framework refuses two overrides on one address, and a
# refused one fails the whole mod plan. Each feature that needs it requires
# it ([[requirement]]), so it runs exactly while one of them is on. Selects
# the trusted plugin compiled into this game from src/mods/actor_update_hub.c.
# This package contains no game data.
format_version = 11
id = "bbt.shared"
version = "0.4.0"
# 0.<N>.0: N is the netplay compatibility number every bbt.* package shares
# (and VERSION). Bump it in all of them on any change to simulation
# behaviour: a LAN guest without the host's version is refused, so two
# different builds cannot start a match (NOTES.md "Netplay compatibility").
name = "Shared game hooks (internal)"
author = "BugsBunnyTazRecomp project"
description = "Internal: hooks shared by the Own View, Third Character and Decorations features. Turned on by them when needed."
resolver = "declarative"

[[target]]
game_id = "SLUS-01144"

[[feature]]
id = "actor-update"
name = "Shared Actor_Update hook (internal)"
description = "Internal. One override of the game's Actor_Update for the features that need it (own view, third player). Turned on automatically by those features."
group = "Internal"
default_enabled = false
hidden = true

[[plugin]]
feature = "actor-update"
id = "bbt.shared.actor-update"

[[feature]]
id = "load-image"
name = "Shared LoadImage hook (internal)"
description = "Internal. One override of the game's texture upload (PsyQ LoadImage core) for the features that need it (the Turkish flag, the Transylvania-enemy test). Turned on automatically by those features."
group = "Internal"
default_enabled = false
hidden = true

[[plugin]]
feature = "load-image"
id = "bbt.shared.load-image"
