# Own view (Phase 6 step N4, in development): every player's own camera.
# Selects the trusted plugin compiled into this game from
# src/mods/own_view.c. This package contains no game data.
format_version = 11
id = "bbt.own-view"
version = "0.1.0"
name = "Own View (in development)"
author = "BugsBunnyTazRecomp project"
description = "Work in progress: every player's own camera."
resolver = "declarative"

[[target]]
game_id = "SLUS-01144"

[[feature]]
id = "two-views"
name = "Two views (experiment)"
description = "Developer test. In a 2-player level, turns on the game engine's own extra views, each with its own single-player camera and controls: two views, three with the third player (Third Character: p3). Offline the screen is split into bands (player 1 on top). In a netplay match with OpenGL each player sees their own character full screen. Every player needs it."
group = "Own view (in development)"
default_enabled = false

[[plugin]]
feature = "two-views"
id = "bbt.own-view.two-views"

# Actor_Update is hooked through bbt.shared (src/mods/actor_update_hub.h).
[[requirement]]
feature = "two-views"
package = "bbt.shared"
requires_feature = "actor-update"
