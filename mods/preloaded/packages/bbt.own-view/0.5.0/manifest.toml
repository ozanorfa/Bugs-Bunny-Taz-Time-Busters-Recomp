# Own view (Phase 6 step N4, in development): every player's own camera.
# Selects the trusted plugin compiled into this game from
# src/mods/own_view.c. This package contains no game data.
format_version = 11
id = "bbt.own-view"
version = "0.5.0"
# 0.<N>.0: N is the netplay compatibility number every bbt.* package shares
# (and VERSION). Bump it in all of them on any change to simulation
# behaviour: a LAN guest without the host's version is refused, so two
# different builds cannot start a match (NOTES.md "Netplay compatibility").
name = "Own View (in development)"
author = "BugsBunnyTazRecomp project"
description = "Work in progress: every player's own camera."
resolver = "declarative"

[[target]]
game_id = "SLUS-01144"

[[feature]]
id = "two-views"
name = "Own view for every player"
description = "In a 2-player level, every player gets their own camera and controls (the game engine's own extra views: two, three with the third player). In a netplay match each PC shows its own player full screen. On one PC the game keeps its shared screen unless \"On one PC\" is set to split screen (bands, player 1 on top). In a LAN room the host's choice counts for everyone."
group = "Own view (in development)"
default_enabled = true

[[plugin]]
feature = "two-views"
id = "bbt.own-view.two-views"

[[option]]
feature = "two-views"
id = "offline"
label = "On one PC"
type = "choice"
default = "shared"

[[option.choice]]
value = "shared"
label = "The game's shared screen"

[[option.choice]]
value = "split"
label = "Split screen, a band per player"

# Actor_Update is hooked through bbt.shared (src/mods/actor_update_hub.h).
[[requirement]]
feature = "two-views"
package = "bbt.shared"
requires_feature = "actor-update"
